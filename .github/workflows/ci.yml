name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  public-readiness:
    name: Public repository readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/check-public-readiness.mjs

  node-benchmark:
    name: Node benchmark tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22", "24"]
    defaults:
      run:
        working-directory: benchmarks/finance/qveris-finance-benchmark
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The suite has zero runtime dependencies, so no `npm install` step.
      # Always invoke via `npm test`: the script uses the `test/*.test.mjs`
      # glob deliberately — a bare `node --test test/` fails on Node >= 20
      # and would also pick up test/fixtures/fake-judge.mjs.
      - run: npm test

  node-benchmark-lint:
    name: Node benchmark lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benchmarks/finance/qveris-finance-benchmark
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # `npm run lint` fetches eslint via npx on demand, keeping the package
      # itself dependency-free.
      - run: npm run lint

  python-harness:
    name: Python harness checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
